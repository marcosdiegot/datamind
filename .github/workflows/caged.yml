name: CAGED Base SP v2
on:
  workflow_dispatch:
concurrency:
  group: caged-pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  mes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        comp: ['202301','202302','202303','202304','202305','202306','202307','202308','202309','202310','202311','202312','202401','202402','202403','202404','202405','202406','202407','202408','202409','202410','202411','202412','202501','202502','202503','202504','202505','202506','202507','202508','202509','202510','202511','202512','202601','202602','202603','202604']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          pip install -q pandas
      - name: Processar mês
        env:
          COMP: ${{ matrix.comp }}
        run: python estudos/caged/caged_pipeline.py
      - uses: actions/upload-artifact@v4
        with:
          name: parcial-${{ matrix.comp }}
          path: parcial_*_${{ matrix.comp }}.csv
  agrega:
    needs: mes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parciais
          merge-multiple: true
      - name: Agregar e commitar
        run: |
          pip install -q pandas
          python - << 'PY'
          import glob, pandas as pd, os
          os.makedirs("estudos/caged", exist_ok=True)
          tabelas = {
            "resumo":  ("estudos/caged/resultado_sazonalidade_sp.csv", ["ano","mes"]),
            "cnae":    ("estudos/caged/base_cnae_sp.csv",   ["ano","mes","secao","tipico","mov"]),
            "cbo4":    ("estudos/caged/base_cbo4_sp.csv",   ["ano","mes","cbo4","mov"]),
            "ti6":     ("estudos/caged/base_ti_cbo6_sp.csv",["ano","mes","cbo6","faixa_sm","mov"]),
            "tipomov": ("estudos/caged/base_ti_tipomov_sp.csv",["ano","mes","tipomovimentacao","mov"]),
          }
          for nome, (saida, chaves) in tabelas.items():
              files = sorted(glob.glob(f"parciais/parcial_{nome}_*.csv"))
              frames = [pd.read_csv(f) for f in files]
              if os.path.exists(saida):
                  frames.append(pd.read_csv(saida))
              if not frames:
                  print(nome, ": sem dados"); continue
              df = (pd.concat(frames)
                      .drop_duplicates(subset=chaves, keep="first")
                      .sort_values(chaves))
              df.to_csv(saida, index=False)
              print(nome, ":", len(df), "linhas | meses:", df[["ano","mes"]].drop_duplicates().shape[0])
          PY
          git config user.name "datamind-bot"
          git config user.email "bot@datamind"
          git stash || true
          git pull --rebase
          git stash pop || true
          git add estudos/caged/*.csv
          git commit -m "data: base CAGED SP v2 (resumo, cnae, cbo4, ti6, tipomov) 2023-2026" || echo "sem mudanças"
          git push
